[project]
name = "offerzen-mrd-api"
version = "0.1.0"
description = "Small consumer API"
authors = [
    {name = "Cahil Henry - Leyte"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.163.2,<0.164.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "valkey (>=6.2.0,<7.0.0)",
    "python-dotenv (>=1.2,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "pytest (>=9,<10)",
    "httpx2 (>=2.16.2,<3.0.0)"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
